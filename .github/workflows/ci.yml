name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# A new push to the same branch makes the in-flight run obsolete.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Typecheck, lint, test
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      # Lint is reported but not gating: the repository carries 222 pre-existing
      # `no-explicit-any` errors. Flip this to a hard failure once that debt is
      # paid, so new violations cannot be introduced.
      - name: Lint
        run: npm run lint
        continue-on-error: true

      - name: Unit tests
        run: npm test

      - name: Colour contrast (WCAG AA)
        run: npm run test:contrast

  build:
    name: Production build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: verify

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      - name: Build
        run: npm run build
        env:
          NEXTAUTH_SECRET: ci-placeholder-secret-not-used-in-production-0000
          NEXT_PUBLIC_SITE_URL: https://sih.glbajajgroup.org
          NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: pk_test_ZmluZS1tdXR0LTYwLmNsZXJrLmFjY291bnRzLmRldiQ
          CLERK_SECRET_KEY: sk_test_kWeP66232cUjPUs4FtmDBRcXMDe4feTh7IX5Y7Xp8C
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/postgres

  audit:
    name: Dependency audit
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      # Reported, not gating: the three known advisories are in postcss and sharp,
      # both transitive dependencies of next with no available fix.
      - name: Audit
        run: npm audit --audit-level=high
        continue-on-error: true
