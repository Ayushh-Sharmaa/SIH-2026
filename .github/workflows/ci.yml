name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# A new push to the same branch makes the in-flight run obsolete.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Typecheck, lint, test
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      # Lint is reported but not gating: the repository carries 222 pre-existing
      # `no-explicit-any` errors. Flip this to a hard failure once that debt is
      # paid, so new violations cannot be introduced.
      - name: Lint
        run: npm run lint
        continue-on-error: true

      - name: Unit tests
        run: npm test

      - name: Colour contrast (WCAG AA)
        run: npm run test:contrast

  build:
    name: Production build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: verify

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      - name: Build
        run: npm run build
        env:
          # The build must not depend on real credentials. A dummy secret long
          # enough to satisfy the 32-character guard in src/lib/auth.ts keeps the
          # production check honest without leaking anything.
          NEXTAUTH_SECRET: ci-placeholder-secret-not-used-in-production-0000
          NEXT_PUBLIC_SITE_URL: https://sih.glbajajgroup.org

  audit:
    name: Dependency audit
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      # Reported, not gating: the three known advisories are in postcss and sharp,
      # both transitive dependencies of next with no available fix.
      - name: Audit
        run: npm audit --audit-level=high
        continue-on-error: true
